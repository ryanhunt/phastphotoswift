name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build and test (macOS)
        run: swift test
      - name: Build (iOS Simulator)
        run: xcodebuild -scheme PhastPhoto-Package -destination 'generic/platform=iOS Simulator' build

  driver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the iPadOS USB driver extension (DriverKit)
        # The generated project is committed, so the runner needs no XcodeGen.
        run: |
          xcodebuild -project Drivers/PhastPhotoUSBDriver/PhastPhotoUSBDriver.xcodeproj -target PhastPhotoUSBDriver \
            -sdk driverkit build CODE_SIGNING_ALLOWED=NO
